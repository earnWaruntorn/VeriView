services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fakereview1234
      POSTGRES_DB: senior_project_db
    ports:
      - "5433:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql 

  backend:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env 
    environment:
      - DB_HOST=db 
      - DB_PORT=5432
    depends_on:
      - db
    volumes:
      - ./models:/app/models

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com  
      PGADMIN_DEFAULT_PASSWORD: fakereview1234 
    ports:
      - "8080:80" 
    depends_on:
      - db

volumes:
  postgres_data: